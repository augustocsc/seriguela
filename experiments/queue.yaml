# experiments/queue.yaml
# Fila de experimentos para o daemon Colab (seriguela_runner.ipynb)
#
# Como funciona:
#   1. Claude edita este arquivo e comita no git
#   2. O daemon no Colab faz `git pull` periodicamente
#   3. Cada experimento com status: pending é executado na ordem
#   4. O daemon atualiza o status para running/done/failed e comita de volta
#
# Status válidos:
#   pending  → aguardando execução
#   running  → em execução (não editar)
#   done     → concluído com sucesso
#   failed   → falhou (ver campo error)
#   skipped  → pulado manualmente (idempotente: já tem resultados)
#
# Para adicionar experimentos: inserir novos items no final de `queue`
# Para cancelar: mudar status: pending → skipped

meta:
  version: "1.1"
  project: seriguela
  created: "2026-05-18"
  updated: "2026-05-22"
  description: "Fila principal de experimentos — editada por Claude, executada no Colab"
  colab_runner: "colab/seriguela_runner.ipynb"

defaults:
  # Parâmetros padrão herdados por todos os experimentos (podem ser sobrescritos)
  script: "2_training/reinforcement/run_experiment.py"
  max_hours: 1.5
  retry_on_oom: true  # reduz batch_size pela metade e tenta de novo

queue:
  # ══════════════════════════════════════════════════════════════════════════════
  # FASE 1 — Piloto zero-shot best-of-N (seleção de modelo)
  # Objetivo: identificar qual(is) dos 6 modelos valem RL na Fase 2
  # Algoritmo: best_of_n puro (SEM treino RL — pure inference)
  # Problema: nguyen_1 (fácil), nguyen_5 (trig médio), nguyen_9 (multi-var difícil)
  # Seeds: 5 seeds por entrada (aggregate gerado automaticamente)
  # Samples: 512 por seed (max_steps=8 × batch_size=64)
  # Reward: sr_ic (recompensa uniforme para fase 2)
  # GPU: T4 free tier — não usa Colab Pro units!
  # Estimativa total: ~4-6h T4 (modelos maiores são mais lentos)
  # ══════════════════════════════════════════════════════════════════════════════

  # ──────────────────────────────────────────────────────────────────────────
  # GPT-2 BASE INFIX (124M)
  # ──────────────────────────────────────────────────────────────────────────

  - id: phase1_base_infix_bon_nguyen1
    status: pending
    args:
      algorithm: best_of_n
      model: "augustocsc/gpt2_base_infix_682k"
      problem: nguyen_1
      reward: sr_ic
      penalty: gradient
      max_steps: 8
      batch_size: 64
      seeds: [42, 123, 456, 789, 1011]
      no_wandb: true
    output_dir: "results/phase_1/base_infix/nguyen_1/"
    estimated_minutes: 15
    phase: 1
    created: "2026-05-22"

