  # Seeds: 5 seeds por entrada (aggregate gerado automaticamente)
  # Samples: 512 por seed = max_steps × batch_size
  #   Base/Medium: max_steps=4 × batch_size=128 = 512 (fp16 cabe em T4 16GB)
  #   Large:       max_steps=8 × batch_size=64  = 512 (fp16, margem de segurança)
  # Reward: sr_ic (recompensa uniforme para fase 2)
  # GPU: T4 free tier — não usa Colab Pro units!
